<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annie — Interactive Obsidian Design Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
  <style>
    :root {
      --obsidian: #0D0E11;
      --charcoal: #1A1C20;
      --chrome: #A8B0B8;
      --silver: #D6DCE2;
      --white: #F4F6F8;
      --line: rgba(168, 176, 184, 0.18);
      --line-strong: rgba(214, 220, 226, 0.38);
      --font-ui: "Nunito", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "JetBrains Mono", Consolas, monospace;
      --ease-out: cubic-bezier(0.05, 0.7, 0.1, 1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font-ui);
      background: #07080A;
      color: var(--white);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Studio Settings Top Bar */
    .studio-bar {
      background: var(--obsidian);
      border-bottom: 1px solid var(--line);
      padding: 10px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }
    .studio-id {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.02em;
      color: var(--white);
    }
    .studio-id span {
      color: var(--chrome);
      font-weight: 500;
      font-size: 12px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
    }
    .seg-group {
      display: inline-flex;
      align-items: center;
      background: var(--charcoal);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
    }
    .seg-btn {
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 600;
      color: var(--chrome);
      background: transparent;
      border: none;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: color 160ms var(--ease-out), background 160ms var(--ease-out);
    }
    .seg-btn:hover { color: var(--white); }
    .seg-btn.active { background: var(--white); color: var(--obsidian); }
    .meter {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--silver);
      letter-spacing: 0.02em;
    }

    /* Stage */
    .stage {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px 36px;
      background:
        radial-gradient(circle at 50% 0%, rgba(214, 220, 226, 0.05), transparent 55%),
        #07080A;
    }

    /* Simulated Device Frame */
    .viewport-shell {
      width: 1280px;
      max-width: 100%;
      height: 760px;
      background: var(--obsidian);
      border: 1px solid var(--line-strong);
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.65);
      transition: width 260ms var(--ease-out), height 260ms var(--ease-out);
    }
    .viewport-shell.vp-mobile { width: 375px; height: 740px; border-radius: 34px; }
    .viewport-shell.vp-tablet { width: 768px; height: 760px; border-radius: 26px; }
    .viewport-shell.vp-desktop { width: 1280px; height: 760px; }

    /* App Header */
    .app-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--obsidian);
      flex-shrink: 0;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .head-actions { display: flex; align-items: center; gap: 8px; }
    .btn {
      font-family: var(--font-ui);
      font-size: 12.5px;
      font-weight: 700;
      padding: 8px 14px;
      min-height: 36px;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: var(--charcoal);
      color: var(--white);
      cursor: pointer;
      transition: transform 150ms var(--ease-out), border-color 150ms var(--ease-out), background 150ms var(--ease-out);
    }
    .btn:hover { border-color: var(--white); transform: translateY(-1px); }
    .btn:active { transform: scale(0.98); }
    .btn-invert { background: var(--white); color: var(--obsidian); border-color: var(--white); }
    .btn-ghost { background: transparent; border-color: var(--line); color: var(--silver); }

    /* App Grid */
    .app-body {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 260px 1fr 330px;
    }
    .vp-tablet .app-body { grid-template-columns: 1fr 300px; }
    .vp-tablet .col-vault { display: none; }
    .vp-mobile .app-body { display: flex; flex-direction: column; }
    .vp-mobile .pane { display: none; flex: 1; }
    .vp-mobile .pane.mobile-active { display: flex; flex-direction: column; }

    .pane {
      min-width: 0;
      min-height: 0;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .pane:last-child { border-right: none; }
    .pane-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .pane-scroll.chat-pad { padding-bottom: 108px; }

    .kicker {
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--chrome);
      margin: 0 0 14px;
    }

    /* Surfaces & Messages */
    .surface {
      background: var(--charcoal);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 15px 16px;
      margin-bottom: 12px;
    }
    .surface-light {
      background: var(--white);
      color: var(--obsidian);
      border-color: var(--white);
    }
    .msg {
      max-width: 84%;
      padding: 13px 16px;
      border-radius: 18px;
      margin-bottom: 14px;
      font-size: 14.5px;
      line-height: 1.55;
      word-break: break-word;
    }
    .msg-user {
      margin-left: auto;
      background: var(--white);
      color: var(--obsidian);
      border-bottom-right-radius: 6px;
      font-weight: 600;
    }
    .msg-annie {
      background: var(--charcoal);
      color: var(--white);
      border: 1px solid var(--line);
      border-bottom-left-radius: 6px;
    }
    .msg-meta {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--chrome);
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .action-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    /* Custom Progress Ring & Hairline Loader (No Emojis / No Badges) */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--charcoal);
      border: 1px solid var(--line-strong);
      border-radius: 14px;
      margin-bottom: 14px;
    }
    .ring-spin { animation: spin 1.2s linear infinite; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .shimmer-track {
      height: 2px;
      width: 100%;
      background: var(--line);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }
    .shimmer-bar {
      height: 100%;
      width: 42%;
      background: linear-gradient(90deg, transparent, var(--white), transparent);
      animation: glide 1.4s ease-in-out infinite;
    }
    @keyframes glide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(300%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ring-spin, .shimmer-bar { animation: none; }
    }

    /* Connections List */
    .conn-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
      font-size: 13.5px;
    }
    .conn-item:last-child { border-bottom: none; }
    .conn-state {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--silver);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-line {
      width: 14px;
      height: 2px;
      background: var(--white);
      border-radius: 2px;
    }
    .status-line.off { background: rgba(168, 176, 184, 0.3); }

    /* Telemetry Log (Nunito — clean human legibility) */
    .trace-row {
      padding: 11px 13px;
      border-left: 2px solid var(--silver);
      background: rgba(26, 28, 32, 0.72);
      border-radius: 0 12px 12px 0;
      margin-bottom: 10px;
      font-family: var(--font-ui);
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      line-height: 1.5;
      color: var(--silver);
      word-break: break-word;
    }
    .trace-row strong { color: var(--white); font-weight: 700; }
    .trace-row.alert { border-left-color: var(--white); background: #22252B; }

    /* Floating Dynamic Input Dock + Separate Floating Attachment Icon */
    .floating-dock {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }
    .attach-fab {
      pointer-events: auto;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--charcoal);
      border: 1px solid var(--line-strong);
      color: var(--silver);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      transition: transform 180ms var(--ease-out), border-color 180ms var(--ease-out), color 180ms var(--ease-out);
    }
    .attach-fab:hover { transform: translateY(-2px); border-color: var(--white); color: var(--white); }
    .input-pill {
      pointer-events: auto;
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(26, 28, 32, 0.94);
      backdrop-filter: blur(14px);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 6px 6px 6px 18px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
      transition: border-color 180ms var(--ease-out), transform 180ms var(--ease-out);
    }
    .input-pill:focus-within { border-color: var(--white); transform: translateY(-1px); }
    .input-pill input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--white);
      font-family: var(--font-ui);
      font-size: 14px;
    }
    .input-pill input::placeholder { color: var(--chrome); }
    .send-fab {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--white);
      color: var(--obsidian);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 140ms var(--ease-out);
    }
    .send-fab:hover { transform: scale(1.05); }

    /* Mobile Bottom Navigation */
    .mobile-nav {
      display: none;
      border-top: 1px solid var(--line);
      background: var(--obsidian);
      padding: 4px 8px;
      flex-shrink: 0;
    }
    .vp-mobile .mobile-nav { display: grid; grid-template-columns: repeat(3, 1fr); }
    .mobile-nav button {
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 700;
      color: var(--chrome);
      background: transparent;
      border: none;
      min-height: 44px;
      cursor: pointer;
    }
    .mobile-nav button.active { color: var(--white); }
  </style>
</head>
<body>
  <div class="studio-bar">
    <div class="studio-id">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4F6F8" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>

    </div>
    <div class="controls">
      <div class="seg-group" id="vp-controls" aria-label="Viewport size">
        <button class="seg-btn" data-vp="vp-mobile">375px</button>

        <button class="seg-btn active" data-vp="vp-desktop">1280px</button>

      <div class="seg-group" id="state-controls" aria-label="App state">
        <button class="seg-btn active" data-state="proactive">T-30m Alert</button>

  <div class="stage">

      <div class="app-body">

              <div class="conn-item"><span>Gmail &amp; Calendar</span><span class="conn-state"><span class="status-line"></span>Linked</span></div>

              <div class="conn-item"><span>Outlook</span><span class="conn-state"><span class="status-line off"></span>Off</span></div>
              <div class="conn-item"><span>Treg Gateway</span><span class="conn-state"><span class="status-line"></span>Active</span></div>
            </div>
            <p class="kicker" style="margin-top:20px;">Share Across Channels</p>
            <div class="surface">
              <div style="font-size:13px;color:var(--silver);line-height:1.5;">Send this code on WhatsApp or Telegram to use the same account:</div>
              <div style="font-family:var(--font-mono);font-size:15px;font-weight:600;margin-top:10px;letter-spacing:0.08em;color:var(--white);">LINK-482910</div>
            </div>
          </div>
        </aside>

        <!-- Chat Column -->
        <section class="pane mobile-active" id="pane-chat">
          <div class="pane-scroll chat-pad" id="chat-feed"></div>

          <div class="floating-dock">
            <button class="attach-fab" title="Attach file, invoice, or audio" aria-label="Attach file">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
              </svg>
            </button>
            <div class="input-pill">
              <input type="text" placeholder="Ask Annie to handle something..." />
              <button class="send-fab" aria-label="Send message">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 12h14"/><path d="M13 5l7 7-7 7"/>
                </svg>
              </button>
            </div>
          </div>
        </section>

        <!-- Live Monitor Column -->
        <aside class="pane" id="pane-monitor">
          <div class="pane-scroll">
            <p class="kicker">Live Trace &amp; Guardrails</p>
            <div id="trace-feed"></div>
          </div>
        </aside>
      </div>

      <nav class="mobile-nav" id="mobile-nav">
        <button class="active" data-tab="pane-chat">Chat</button>
        <button data-tab="pane-vault">Accounts</button>
        <button data-tab="pane-monitor">Monitor</button>
      </nav>
    </div>
  </div>

          <div class="msg msg-annie" style="border-color:var(--white);">
            <strong>Quarantined 1 hidden instruction.</strong> The email contained a prompt telling me to wire 500 EUR. I dropped that line and kept only the bill numbers.
            <div class="msg-meta"><span>ALLOW_PAYMENTS=false</span><span>injection_suspected</span></div>
          </div>
          <div class="msg msg-annie">
            Your plan jumps from <strong>45 EUR to 54 EUR/month (+20%)</strong>. I drafted a switch inquiry. Nothing goes out until you confirm.
            <div class="action-strip">
              <button class="btn btn-invert">Approve (YES apr-91f2)</button>
              <button class="btn btn-ghost">Cancel</button>
            </div>
          </div>
        `,
        traces: [
          "<strong>#4 awaiting_approval</strong> · gated send_external_email behind YES apr-91f2",
          "<strong>#3 policy</strong> · BLOCK execute_payment (ALLOW_PAYMENTS=false)",
          "<strong>#2 sanitise</strong> · quarantined ignore_instructions + hidden_html_stripped",
          "<strong>#1 ingress</strong> · renewal notice (1.4 KB)"
        ]
      },
      killed: {
        chat: `
          <div class="msg msg-user">Plan Saturday in Lisbon for two under 60 EUR.</div>
          <div class="msg msg-annie" style="border-color:var(--line-strong);">
            <strong>Stopped mid-run.</strong> You pressed Stop Run while fetching routes. Pending requests were cancelled and nothing was saved to your calendar.
            <div class="msg-meta"><span>killed_by_user</span><span>hash-chain valid (3 events)</span></div>
          </div>
        `,
        traces: [
          "<strong>#3 killed_by_user</strong> · AbortController cancelled in-flight fetch in 18ms",
          "<strong>#2 policy</strong> · ALLOW plan_itinerary",
          "<strong>#1 ingress</strong> · web:usr-sandbox"
        ]
      }
    };

    const shell = document.getElementById("shell");
    const chatFeed = document.getElementById("chat-feed");
    const traceFeed = document.getElementById("trace-feed");
    const meter = document.getElementById("overflow-meter");

    function checkOverflow() {
      requestAnimationFrame(() => {
        const overflow = shell.scrollWidth > shell.clientWidth;
        meter.textContent = overflow
          ? `OVERFLOW: FAIL (${shell.scrollWidth}px > ${shell.clientWidth}px)`
          : `WIDTH ${shell.clientWidth}px · 0 OVERFLOW`;
      });
    }

    function renderState(key) {
      const s = STATES[key];
      chatFeed.innerHTML = s.chat;
      traceFeed.innerHTML = s.traces
        .map((t, i) => `<div class="trace-row${i === 0 ? " alert" : ""}">${t}</div>`)
        .join("");
      checkOverflow();
    }

    document.querySelectorAll("#vp-controls .seg-btn").forEach((b) => {
      b.addEventListener("click", () => {
        document.querySelectorAll("#vp-controls .seg-btn").forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        shell.className = "viewport-shell " + b.dataset.vp;
        setTimeout(checkOverflow, 280);
      });
    });

    document.querySelectorAll("#state-controls .seg-btn").forEach((b) => {
      b.addEventListener("click", () => {
        document.querySelectorAll("#state-controls .seg-btn").forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        renderState(b.dataset.state);
      });
    });

    document.querySelectorAll("#mobile-nav button").forEach((b) => {
      b.addEventListener("click", () => {
        document.querySelectorAll("#mobile-nav button").forEach((x) => x.classList.remove("active"));
        document.querySelectorAll(".pane").forEach((p) => p.classList.remove("mobile-active"));
        b.classList.add("active");
        document.getElementById(b.dataset.tab).classList.add("mobile-active");
        checkOverflow();
      });
    });

    renderState("proactive");
  </script>
</body>
</html>
